name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes baseline
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Gate de fronteiras de build (.token-optimizer/manifest/CSP)
        run: npm run check:build-boundaries

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke E1 (CSP × Chart.js contra preview)
        run: npm run test:e1
